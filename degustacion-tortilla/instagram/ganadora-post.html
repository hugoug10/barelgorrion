<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Cinzel';src:url(../../assets/fonts/cinzel-latin.woff2) format('woff2');font-weight:400 900}
@font-face{font-family:'Montserrat';src:url(../../assets/fonts/montserrat-latin.woff2) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:radial-gradient(ellipse 110% 70% at 50% 38%,#3a2c14 0%,#1b1810 50%,#11151c 85%);color:#F7FAFC;font-family:'Montserrat',sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;inset:44px;border:3px solid #C5A059;border-radius:32px}
.wrap{position:absolute;inset:0;padding:110px 100px 105px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:18px;font-family:'Cinzel',serif;font-weight:700;font-size:46px;letter-spacing:.12em;color:#C5A059}
.brand img{height:72px}
.pill{margin-top:48px;background:#F5C04A;color:#11151c;font-weight:800;font-size:28px;letter-spacing:.2em;padding:16px 38px;border-radius:999px}
.k{margin-top:46px;font-family:'Cinzel',serif;font-weight:700;font-size:44px;letter-spacing:.06em;color:#CBD5E0}
.crown{margin-top:34px;width:120px;height:120px}
h1{margin-top:24px;font-family:'Cinzel',serif;font-weight:800;font-size:62px;line-height:1.14;white-space:nowrap}
h1 span{color:#F5C04A}
.rule{width:240px;height:3px;background:#C5A059;opacity:.6;margin:46px 0 40px}
.carta{font-family:'Cinzel',serif;font-weight:700;font-size:52px;line-height:1.18;color:#F5C04A}
.foot{margin-top:auto;font-size:30px;font-weight:500;color:#CBD5E0;line-height:1.45}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <div class="brand"><img src="../../assets/logo_hand-removebg-preview.png" alt="">EL GORRIÓN</div>
  <div class="pill">DEGUSTACIÓN DE TORTILLAS</div>
  <div class="k">Y la ganadora es…</div>
  <svg class="crown" viewBox="0 0 64 64" fill="none" stroke="#F5C04A" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M10 46 L6 18 L22 30 L32 12 L42 30 L58 18 L54 46 Z" fill="rgba(245,192,74,.14)"/>
    <path d="M12 54 H52"/><circle cx="6" cy="18" r="3" fill="#F5C04A"/><circle cx="32" cy="12" r="3" fill="#F5C04A"/><circle cx="58" cy="18" r="3" fill="#F5C04A"/>
  </svg>
  <h1>Tortilla de<br><span>queso de cabra</span><br>y cebolla caramelizada<br>al Oporto</h1>
  <div class="rule"></div>
  <div class="carta">¡Entra en nuestra carta!</div>
  <div class="foot">Gracias a todos los que vinisteis y votasteis.<br>Muy pronto la podréis pedir en El Gorrión.</div>
</div>
</body></html>
