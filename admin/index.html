<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Bar El Gorrión</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a202c;
      --surface: #2d3748;
      --surface2: #3a4a60;
      --gold: #c5a059;
      --gold-light: #e2c17a;
      --text: #e2e8f0;
      --text-muted: #a0aec0;
      --danger: #fc8181;
      --success: #68d391;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    #login-screen h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 0.4rem;
      letter-spacing: 2px;
    }
    #login-screen p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid rgba(197,160,89,0.3);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    .login-box label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .login-box input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid rgba(197,160,89,0.4);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-box input[type="password"]:focus {
      border-color: var(--gold);
    }
    .btn-login {
      margin-top: 1.2rem;
      width: 100%;
      background: var(--gold);
      color: #1a202c;
      border: none;
      border-radius: var(--radius);
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: var(--gold-light); }
    #login-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.8rem;
      text-align: center;
      min-height: 1.2em;
    }

    /* ── App shell ── */
    #app { display: none; }

    header {
      background: var(--surface);
      border-bottom: 2px solid rgba(197,160,89,0.3);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.2rem; color: var(--gold); letter-spacing: 2px; }
    header span { font-size: 0.8rem; color: var(--text-muted); }

    .btn-logout {
      background: none;
      border: 1px solid rgba(197,160,89,0.4);
      color: var(--text-muted);
      border-radius: var(--radius);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    main { padding: 1.5rem; max-width: 900px; margin: 0 auto; padding-bottom: 100px; }

    /* ── Groups & categories ── */
    .group-title {
      font-size: 1.4rem;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(197,160,89,0.3);
    }

    .category-card {
      background: var(--surface);
      border: 1px solid rgba(197,160,89,0.2);
      border-radius: var(--radius);
      margin-bottom: 1.2rem;
      overflow: hidden;
    }
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      cursor: pointer;
      background: rgba(197,160,89,0.08);
      user-select: none;
    }
    .category-header h3 { font-size: 1rem; color: var(--text); }
    .category-header .chevron { color: var(--gold); font-size: 0.8rem; transition: transform 0.2s; }
    .category-header.open .chevron { transform: rotate(90deg); }

    .category-body { padding: 0.5rem 1rem 1rem; display: none; }
    .category-body.open { display: block; }

    .cat-meta {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }
    .meta-input-wrap { flex: 1; min-width: 200px; }
    .meta-input-wrap label { font-size: 0.72rem; color: var(--text-muted); display: block; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 1px; }
    .meta-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid rgba(197,160,89,0.3);
      border-radius: 6px;
      color: var(--text);
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
      outline: none;
    }
    .meta-input:focus { border-color: var(--gold); }
    .meta-input::placeholder { color: var(--text-muted); }

    /* ── Items list ── */
    .items-list { margin-bottom: 0.8rem; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .item-row:last-child { border-bottom: none; }

    .item-row.header-row {
      padding: 0.6rem 0 0.3rem;
      border-bottom: none;
    }
    .header-badge {
      background: rgba(197,160,89,0.15);
      border: 1px solid rgba(197,160,89,0.4);
      border-radius: 4px;
      padding: 0.2rem 0.5rem;
      font-size: 0.78rem;
      color: var(--gold);
      font-weight: 700;
      flex: 1;
    }

    .item-name-input, .item-price-input {
      background: var(--bg);
      border: 1px solid rgba(197,160,89,0.25);
      border-radius: 6px;
      color: var(--text);
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .item-name-input:focus, .item-price-input:focus { border-color: var(--gold); }
    .item-name-input { flex: 3; min-width: 0; }
    .item-price-input { flex: 1; min-width: 80px; max-width: 110px; }

    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 1.1rem;
      padding: 0 4px;
      touch-action: none;
    }

    .btn-del {
      background: none;
      border: 1px solid rgba(252,129,129,0.35);
      color: var(--danger);
      border-radius: 6px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-del:hover { background: rgba(252,129,129,0.1); }

    .add-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }
    .btn-add-item, .btn-add-header {
      background: none;
      border: 1px dashed rgba(197,160,89,0.5);
      color: var(--gold);
      border-radius: var(--radius);
      padding: 0.4rem 0.8rem;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-add-item:hover, .btn-add-header:hover { background: rgba(197,160,89,0.08); }

    /* ── Floating save bar ── */
    #save-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 2px solid rgba(197,160,89,0.4);
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      z-index: 200;
    }
    #save-status { font-size: 0.85rem; color: var(--text-muted); flex: 1; }
    #save-status.ok { color: var(--success); }
    #save-status.err { color: var(--danger); }

    .btn-save {
      background: var(--gold);
      color: #1a202c;
      border: none;
      border-radius: var(--radius);
      padding: 0.7rem 1.8rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }
    .btn-save:hover { background: var(--gold-light); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Loading spinner ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      color: var(--text-muted);
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .item-price-input { max-width: 85px; }
    }
  </style>
</head>
<body>

<!-- ─── Login Screen ─── -->
<div id="login-screen">
  <h1>EL GORRIÓN</h1>
  <p>Panel de administración</p>
  <div class="login-box">
    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" placeholder="••••••••" autofocus>
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ─── App ─── -->
<div id="app">
  <header>
    <h1>CARTA · ADMIN</h1>
    <div style="display:flex;align-items:center;gap:1rem;">
      <span id="header-info">Bar El Gorrión</span>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <main>
    <div id="loading">Cargando carta...</div>
    <div id="menu-editor" style="display:none;"></div>
  </main>

  <div id="save-bar">
    <div id="save-status">Haz tus cambios y pulsa Guardar cuando termines.</div>
    <button class="btn-save" id="btn-save" onclick="saveMenu()">💾 Guardar y Publicar</button>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let menuData = null;
let sessionPwd = null;

// ─── Login ───────────────────────────────────────────────────────────────────
function doLogin() {
  const pwd = document.getElementById('pwd').value.trim();
  if (!pwd) return;
  sessionPwd = pwd;
  sessionStorage.setItem('adm_pwd', pwd);
  showApp();
}

function doLogout() {
  sessionStorage.removeItem('adm_pwd');
  sessionPwd = null;
  location.reload();
}

document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Check if already logged in this session
const storedPwd = sessionStorage.getItem('adm_pwd');
if (storedPwd) {
  sessionPwd = storedPwd;
  showApp();
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadMenu();
}

// ─── Load menu data ───────────────────────────────────────────────────────────
async function loadMenu() {
  try {
    const res = await fetch('../data/menu.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    menuData = await res.json();
    renderEditor();
  } catch (e) {
    document.getElementById('loading').textContent = 'Error cargando la carta: ' + e.message;
  }
}

// ─── Render editor ────────────────────────────────────────────────────────────
function renderEditor() {
  const editor = document.getElementById('menu-editor');
  document.getElementById('loading').style.display = 'none';
  editor.style.display = 'block';
  editor.innerHTML = '';

  menuData.groups.forEach((group, gi) => {
    const groupDiv = document.createElement('div');
    groupDiv.innerHTML = `<div class="group-title">${esc(group.name)}</div>`;

    group.categories.forEach((cat, ci) => {
      groupDiv.appendChild(buildCategoryCard(gi, ci, cat));
    });

    editor.appendChild(groupDiv);
  });
}

function buildCategoryCard(gi, ci, cat) {
  const card = document.createElement('div');
  card.className = 'category-card';
  card.id = `cat-${gi}-${ci}`;

  const headerEl = document.createElement('div');
  headerEl.className = 'category-header open';
  headerEl.innerHTML = `<h3>${esc(cat.name)}</h3><span class="chevron">▶</span>`;
  headerEl.addEventListener('click', () => {
    headerEl.classList.toggle('open');
    bodyEl.classList.toggle('open');
  });

  const bodyEl = document.createElement('div');
  bodyEl.className = 'category-body open';

  // Meta fields: note and footerNote
  const metaDiv = document.createElement('div');
  metaDiv.className = 'cat-meta';
  metaDiv.innerHTML = `
    <div class="meta-input-wrap">
      <label>Nota superior (opcional)</label>
      <input class="meta-input" type="text" placeholder="ej: *Precio por persona..." value="${esc(cat.note || '')}"
        oninput="menuData.groups[${gi}].categories[${ci}].note = this.value || null; markDirty()">
    </div>
    <div class="meta-input-wrap">
      <label>Nota inferior (opcional)</label>
      <input class="meta-input" type="text" placeholder="ej: *Suplementos: 0,50€" value="${esc(cat.footerNote || '')}"
        oninput="menuData.groups[${gi}].categories[${ci}].footerNote = this.value || null; markDirty()">
    </div>
  `;

  // Items list
  const itemsList = document.createElement('div');
  itemsList.className = 'items-list';
  itemsList.id = `items-${gi}-${ci}`;
  renderItems(itemsList, gi, ci);

  // Add buttons
  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  addRow.innerHTML = `
    <button class="btn-add-item" onclick="addItem(${gi},${ci})">+ Añadir plato</button>
    <button class="btn-add-header" onclick="addHeader(${gi},${ci})">+ Añadir separador</button>
  `;

  bodyEl.append(metaDiv, itemsList, addRow);
  card.append(headerEl, bodyEl);
  return card;
}

function renderItems(container, gi, ci) {
  container.innerHTML = '';
  const items = menuData.groups[gi].categories[ci].items;

  items.forEach((item, ii) => {
    const row = document.createElement('div');
    row.className = 'item-row' + (item.type === 'header' ? ' header-row' : '');
    row.draggable = true;

    if (item.type === 'header') {
      row.innerHTML = `
        <span class="drag-handle" title="Arrastrar">⠿</span>
        <input class="item-name-input" type="text" value="${esc(item.name)}" placeholder="Nombre del separador"
          oninput="menuData.groups[${gi}].categories[${ci}].items[${ii}].name = this.value; markDirty()">
        <button class="btn-del" title="Eliminar" onclick="deleteItem(${gi},${ci},${ii})">✕</button>
      `;
    } else {
      row.innerHTML = `
        <span class="drag-handle" title="Arrastrar">⠿</span>
        <input class="item-name-input" type="text" value="${esc(item.name)}" placeholder="Nombre del plato"
          oninput="menuData.groups[${gi}].categories[${ci}].items[${ii}].name = this.value; markDirty()">
        <input class="item-price-input" type="text" value="${esc(item.price || '')}" placeholder="0,00 €"
          oninput="menuData.groups[${gi}].categories[${ci}].items[${ii}].price = this.value; markDirty()">
        <button class="btn-del" title="Eliminar" onclick="deleteItem(${gi},${ci},${ii})">✕</button>
      `;
    }

    setupDrag(row, gi, ci);
    container.appendChild(row);
  });
}

// ─── CRUD ─────────────────────────────────────────────────────────────────────
function addItem(gi, ci) {
  menuData.groups[gi].categories[ci].items.push({ name: '', price: '' });
  refreshItems(gi, ci);
  markDirty();
  // Focus the new name input
  const list = document.getElementById(`items-${gi}-${ci}`);
  const lastInput = list.querySelector('.item-row:last-child .item-name-input');
  if (lastInput) lastInput.focus();
}

function addHeader(gi, ci) {
  menuData.groups[gi].categories[ci].items.push({ type: 'header', name: '' });
  refreshItems(gi, ci);
  markDirty();
  const list = document.getElementById(`items-${gi}-${ci}`);
  const lastInput = list.querySelector('.item-row:last-child .item-name-input');
  if (lastInput) lastInput.focus();
}

function deleteItem(gi, ci, ii) {
  if (!confirm('¿Eliminar este elemento?')) return;
  menuData.groups[gi].categories[ci].items.splice(ii, 1);
  refreshItems(gi, ci);
  markDirty();
}

function refreshItems(gi, ci) {
  const container = document.getElementById(`items-${gi}-${ci}`);
  renderItems(container, gi, ci);
}

// ─── Drag to reorder ──────────────────────────────────────────────────────────
let dragSrc = null;

function setupDrag(row, gi, ci) {
  row.addEventListener('dragstart', e => {
    dragSrc = row;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => row.style.opacity = '0.4', 0);
  });
  row.addEventListener('dragend', () => {
    row.style.opacity = '';
    syncOrderFromDOM(gi, ci);
    markDirty();
  });
  row.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const list = row.parentNode;
    const bounding = row.getBoundingClientRect();
    const offset = bounding.y + bounding.height / 2;
    if (e.clientY < offset) {
      list.insertBefore(dragSrc, row);
    } else {
      list.insertBefore(dragSrc, row.nextSibling);
    }
  });
}

function syncOrderFromDOM(gi, ci) {
  const container = document.getElementById(`items-${gi}-${ci}`);
  const rows = Array.from(container.querySelectorAll('.item-row'));
  const newItems = rows.map(row => {
    const isHeader = row.classList.contains('header-row');
    const nameInput = row.querySelector('.item-name-input');
    const priceInput = row.querySelector('.item-price-input');
    if (isHeader) {
      return { type: 'header', name: nameInput ? nameInput.value : '' };
    }
    return { name: nameInput ? nameInput.value : '', price: priceInput ? priceInput.value : '' };
  });
  menuData.groups[gi].categories[ci].items = newItems;
  // Re-render to sync indices in event handlers
  renderItems(container, gi, ci);
}

// ─── Dirty tracking & save ────────────────────────────────────────────────────
let isDirty = false;

function markDirty() {
  if (!isDirty) {
    isDirty = true;
    setStatus('Tienes cambios sin guardar.', '');
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.className = cls;
}

async function saveMenu() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  setStatus('Guardando...', '');

  // Collect current input values before sending
  collectAllInputs();

  try {
    const res = await fetch('/api/menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: sessionPwd, menu: menuData }),
    });

    const data = await res.json();

    if (!res.ok) {
      if (res.status === 401) {
        setStatus('Contraseña incorrecta. Sal y vuelve a entrar.', 'err');
      } else {
        setStatus('Error: ' + (data.error || 'desconocido'), 'err');
      }
    } else {
      isDirty = false;
      setStatus('✓ ' + data.message, 'ok');
    }
  } catch (e) {
    setStatus('Error de red: ' + e.message, 'err');
  }

  btn.disabled = false;
}

// Force-read all DOM inputs into menuData before sending (handles drag-reorder edge cases)
function collectAllInputs() {
  menuData.groups.forEach((group, gi) => {
    group.categories.forEach((cat, ci) => {
      const container = document.getElementById(`items-${gi}-${ci}`);
      if (!container) return;
      const rows = Array.from(container.querySelectorAll('.item-row'));
      cat.items = rows.map(row => {
        const isHeader = row.classList.contains('header-row');
        const nameInput = row.querySelector('.item-name-input');
        const priceInput = row.querySelector('.item-price-input');
        if (isHeader) {
          return { type: 'header', name: nameInput ? nameInput.value : '' };
        }
        return { name: nameInput ? nameInput.value : '', price: priceInput ? priceInput.value : '' };
      });
      // Also collect meta notes
      const metaInputs = document.querySelectorAll(`#cat-${gi}-${ci} .meta-input`);
      if (metaInputs[0]) cat.note = metaInputs[0].value || null;
      if (metaInputs[1]) cat.footerNote = metaInputs[1].value || null;
    });
  });
}

// ─── Utility ──────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
