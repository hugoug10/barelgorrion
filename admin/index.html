<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Bar El Gorrión</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a202c;
      --surface: #2d3748;
      --gold: #c5a059;
      --gold-light: #e2c17a;
      --text: #e2e8f0;
      --text-muted: #a0aec0;
      --danger: #fc8181;
      --success: #68d391;
      --radius: 8px;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* ── Login ── */
    #login-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    #login-screen h1 { font-size: 1.8rem; color: var(--gold); margin-bottom: 0.4rem; letter-spacing: 2px; }
    #login-screen p  { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

    .login-box {
      background: var(--surface); border: 1px solid rgba(197,160,89,0.3);
      border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 360px;
    }
    .login-box label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 1px; }
    .login-box input {
      width: 100%; background: var(--bg); border: 1px solid rgba(197,160,89,0.4);
      border-radius: var(--radius); color: var(--text); padding: 0.75rem 1rem;
      font-size: 1rem; outline: none; transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: var(--gold); }

    .btn-primary {
      margin-top: 1.2rem; width: 100%; background: var(--gold); color: #1a202c;
      border: none; border-radius: var(--radius); padding: 0.8rem; font-size: 1rem;
      font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--gold-light); }

    .msg { font-size: 0.85rem; margin-top: 0.8rem; text-align: center; min-height: 1.2em; }
    .msg.err { color: var(--danger); }
    .msg.ok  { color: var(--success); }

    /* ── App ── */
    #app { display: none; }

    header {
      background: var(--surface); border-bottom: 2px solid rgba(197,160,89,0.3);
      padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { font-size: 1.1rem; color: var(--gold); letter-spacing: 2px; }
    .btn-sm {
      background: none; border: 1px solid rgba(197,160,89,0.4); color: var(--text-muted);
      border-radius: var(--radius); padding: 0.35rem 0.75rem; font-size: 0.78rem; cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--danger); color: var(--danger); }

    main { padding: 1.5rem; max-width: 900px; margin: 0 auto; padding-bottom: 100px; }

    /* ── Groups & categories ── */
    .group-title {
      font-size: 1.3rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase;
      margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(197,160,89,0.3);
    }
    .category-card {
      background: var(--surface); border: 1px solid rgba(197,160,89,0.2);
      border-radius: var(--radius); margin-bottom: 1.2rem; overflow: hidden;
    }
    .category-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.8rem 1rem; cursor: pointer; background: rgba(197,160,89,0.08); user-select: none;
    }
    .category-header h3 { font-size: 1rem; color: var(--text); }
    .chevron { color: var(--gold); font-size: 0.8rem; transition: transform 0.2s; }
    .category-header.open .chevron { transform: rotate(90deg); }

    .category-body { padding: 0.5rem 1rem 1rem; display: none; }
    .category-body.open { display: block; }

    .cat-meta { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; }
    .meta-wrap { flex: 1; min-width: 200px; }
    .meta-wrap label { font-size: 0.72rem; color: var(--text-muted); display: block; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 1px; }
    .meta-input {
      width: 100%; background: var(--bg); border: 1px solid rgba(197,160,89,0.3);
      border-radius: 6px; color: var(--text); padding: 0.4rem 0.6rem; font-size: 0.85rem; outline: none;
    }
    .meta-input:focus { border-color: var(--gold); }

    /* ── Items ── */
    .item-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .item-row:last-child { border-bottom: none; }
    .item-row.header-row { padding: 0.6rem 0 0.3rem; border-bottom: none; }

    .drag-handle { color: var(--text-muted); cursor: grab; padding: 0 4px; touch-action: none; }

    .item-name-input, .item-price-input {
      background: var(--bg); border: 1px solid rgba(197,160,89,0.25);
      border-radius: 6px; color: var(--text); padding: 0.4rem 0.6rem; font-size: 0.9rem; outline: none;
    }
    .item-name-input:focus, .item-price-input:focus { border-color: var(--gold); }
    .item-name-input  { flex: 3; min-width: 0; }
    .item-price-input { flex: 1; min-width: 80px; max-width: 110px; }

    .header-badge {
      flex: 1; background: rgba(197,160,89,0.12); border: 1px solid rgba(197,160,89,0.35);
      border-radius: 4px; padding: 0.25rem 0.5rem; font-size: 0.78rem; color: var(--gold); font-weight: 700;
    }

    .btn-del {
      background: none; border: 1px solid rgba(252,129,129,0.35); color: var(--danger);
      border-radius: 6px; width: 30px; height: 30px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0.85rem;
    }
    .btn-del:hover { background: rgba(252,129,129,0.1); }

    .add-row { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .btn-add {
      background: none; border: 1px dashed rgba(197,160,89,0.5); color: var(--gold);
      border-radius: var(--radius); padding: 0.4rem 0.8rem; font-size: 0.82rem; cursor: pointer;
    }
    .btn-add:hover { background: rgba(197,160,89,0.08); }

    /* ── Save bar ── */
    #save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 2px solid rgba(197,160,89,0.4);
      padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; z-index: 200;
    }
    #save-status { font-size: 0.85rem; color: var(--text-muted); flex: 1; }
    #save-status.ok  { color: var(--success); }
    #save-status.err { color: var(--danger); }

    .btn-save {
      background: var(--gold); color: #1a202c; border: none; border-radius: var(--radius);
      padding: 0.7rem 1.8rem; font-size: 1rem; font-weight: 700; cursor: pointer;
      white-space: nowrap; transition: background 0.2s, opacity 0.2s;
    }
    .btn-save:hover    { background: var(--gold-light); }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .item-price-input { max-width: 85px; }
    }
  </style>
</head>
<body>

<!-- ─── Login ─── -->
<div id="login-screen">
  <h1>EL GORRIÓN</h1>
  <p>Panel de administración</p>
  <div class="login-box">
    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" placeholder="••••••••" autofocus>
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <div id="login-msg" class="msg"></div>
  </div>
</div>

<!-- ─── App ─── -->
<div id="app">
  <header>
    <h1>CARTA · ADMIN</h1>
    <button class="btn-sm" onclick="doLogout()">Cerrar sesión</button>
  </header>

  <main>
    <div id="loading" style="text-align:center;padding:3rem;color:var(--text-muted);">Cargando carta...</div>
    <div id="menu-editor" style="display:none;"></div>
  </main>

  <div id="save-bar">
    <div id="save-status">Haz tus cambios y pulsa Guardar cuando termines.</div>
    <button class="btn-save" id="btn-save" onclick="saveMenu()">💾 Guardar y Publicar</button>
  </div>
</div>

<script>
let menuData = null;
let sessionPwd = null;

// ─── Login ───────────────────────────────────────────────────────────────────
(function init() {
  const saved = sessionStorage.getItem('adm_ok');
  if (saved) { sessionPwd = saved; showApp(); }
})();

document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pwd = document.getElementById('pwd').value;
  const msg = document.getElementById('login-msg');
  if (!pwd) return;

  msg.className = 'msg'; msg.textContent = 'Comprobando...';

  // Validate password by attempting a save with dummy data check —
  // actually just try a GET first, then the password is validated on POST
  // Simple approach: store and validate on first save; for now just store
  sessionPwd = pwd;
  sessionStorage.setItem('adm_ok', pwd);
  msg.textContent = '';
  showApp();
}

function doLogout() {
  sessionStorage.removeItem('adm_ok');
  sessionPwd = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd').value = '';
  document.getElementById('pwd').focus();
}

// ─── App ─────────────────────────────────────────────────────────────────────
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadMenu();
}

async function loadMenu() {
  try {
    const res = await fetch('/api/menu');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    menuData = await res.json();
    renderEditor();
  } catch (e) {
    document.getElementById('loading').textContent = 'Error cargando la carta: ' + e.message;
  }
}

// ─── Render ──────────────────────────────────────────────────────────────────
function renderEditor() {
  const editor = document.getElementById('menu-editor');
  document.getElementById('loading').style.display = 'none';
  editor.style.display = 'block';
  editor.innerHTML = '';

  menuData.groups.forEach((group, gi) => {
    const div = document.createElement('div');
    div.innerHTML = `<div class="group-title">${esc(group.name)}</div>`;
    group.categories.forEach((cat, ci) => div.appendChild(buildCard(gi, ci, cat)));
    editor.appendChild(div);
  });
}

function buildCard(gi, ci, cat) {
  const card = document.createElement('div');
  card.className = 'category-card';
  card.id = `cat-${gi}-${ci}`;

  const hdr = document.createElement('div');
  hdr.className = 'category-header open';
  hdr.innerHTML = `<h3>${esc(cat.name)}</h3><span class="chevron">▶</span>`;

  const body = document.createElement('div');
  body.className = 'category-body open';
  hdr.addEventListener('click', () => { hdr.classList.toggle('open'); body.classList.toggle('open'); });

  body.innerHTML = `
    <div class="cat-meta">
      <div class="meta-wrap">
        <label>Nota superior</label>
        <input class="meta-input" type="text" placeholder="ej: *Precio por persona..." value="${esc(cat.note || '')}"
          oninput="menuData.groups[${gi}].categories[${ci}].note=this.value||null;markDirty()">
      </div>
      <div class="meta-wrap">
        <label>Nota inferior</label>
        <input class="meta-input" type="text" placeholder="ej: *Suplementos: 0,50€" value="${esc(cat.footerNote || '')}"
          oninput="menuData.groups[${gi}].categories[${ci}].footerNote=this.value||null;markDirty()">
      </div>
    </div>`;

  const list = document.createElement('div');
  list.className = 'items-list';
  list.id = `items-${gi}-${ci}`;
  renderItems(list, gi, ci);

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  addRow.innerHTML = `
    <button class="btn-add" onclick="addItem(${gi},${ci})">+ Añadir plato</button>
    <button class="btn-add" onclick="addHeader(${gi},${ci})">+ Añadir separador</button>`;

  body.append(list, addRow);
  card.append(hdr, body);
  return card;
}

function renderItems(container, gi, ci) {
  container.innerHTML = '';
  menuData.groups[gi].categories[ci].items.forEach((item, ii) => {
    const row = document.createElement('div');
    row.className = 'item-row' + (item.type === 'header' ? ' header-row' : '');
    row.draggable = true;

    if (item.type === 'header') {
      row.innerHTML = `
        <span class="drag-handle">⠿</span>
        <input class="header-badge item-name-input" type="text" value="${esc(item.name)}" placeholder="Nombre del separador"
          oninput="menuData.groups[${gi}].categories[${ci}].items[${ii}].name=this.value;markDirty()">
        <button class="btn-del" onclick="deleteItem(${gi},${ci},${ii})">✕</button>`;
    } else {
      row.innerHTML = `
        <span class="drag-handle">⠿</span>
        <input class="item-name-input" type="text" value="${esc(item.name)}" placeholder="Nombre del plato"
          oninput="menuData.groups[${gi}].categories[${ci}].items[${ii}].name=this.value;markDirty()">
        <input class="item-price-input" type="text" value="${esc(item.price||'')}" placeholder="0,00 €"
          oninput="menuData.groups[${gi}].categories[${ci}].items[${ii}].price=this.value;markDirty()">
        <button class="btn-del" onclick="deleteItem(${gi},${ci},${ii})">✕</button>`;
    }

    setupDrag(row, gi, ci);
    container.appendChild(row);
  });
}

// ─── CRUD ─────────────────────────────────────────────────────────────────────
function addItem(gi, ci) {
  menuData.groups[gi].categories[ci].items.push({ name: '', price: '' });
  refreshItems(gi, ci); markDirty();
  focusLast(gi, ci);
}
function addHeader(gi, ci) {
  menuData.groups[gi].categories[ci].items.push({ type: 'header', name: '' });
  refreshItems(gi, ci); markDirty();
  focusLast(gi, ci);
}
function deleteItem(gi, ci, ii) {
  if (!confirm('¿Eliminar este elemento?')) return;
  menuData.groups[gi].categories[ci].items.splice(ii, 1);
  refreshItems(gi, ci); markDirty();
}
function refreshItems(gi, ci) {
  renderItems(document.getElementById(`items-${gi}-${ci}`), gi, ci);
}
function focusLast(gi, ci) {
  const last = document.getElementById(`items-${gi}-${ci}`).querySelector('.item-row:last-child .item-name-input');
  if (last) last.focus();
}

// ─── Drag ─────────────────────────────────────────────────────────────────────
let dragSrc = null;
function setupDrag(row, gi, ci) {
  row.addEventListener('dragstart', () => { dragSrc = row; setTimeout(() => row.style.opacity = '0.4', 0); });
  row.addEventListener('dragend',   () => { row.style.opacity = ''; syncDOM(gi, ci); markDirty(); });
  row.addEventListener('dragover',  e  => {
    e.preventDefault();
    const mid = row.getBoundingClientRect().y + row.getBoundingClientRect().height / 2;
    row.parentNode.insertBefore(dragSrc, e.clientY < mid ? row : row.nextSibling);
  });
}
function syncDOM(gi, ci) {
  const rows = Array.from(document.getElementById(`items-${gi}-${ci}`).querySelectorAll('.item-row'));
  menuData.groups[gi].categories[ci].items = rows.map(r => {
    const isHdr = r.classList.contains('header-row');
    const name  = r.querySelector('.item-name-input')?.value || '';
    const price = r.querySelector('.item-price-input')?.value || '';
    return isHdr ? { type: 'header', name } : { name, price };
  });
  renderItems(document.getElementById(`items-${gi}-${ci}`), gi, ci);
}

// ─── Save ─────────────────────────────────────────────────────────────────────
let isDirty = false;
function markDirty() { if (!isDirty) { isDirty = true; setStatus('Tienes cambios sin guardar.', ''); } }
function setStatus(msg, cls) { const el = document.getElementById('save-status'); el.textContent = msg; el.className = cls; }

function collectAll() {
  menuData.groups.forEach((g, gi) => {
    g.categories.forEach((cat, ci) => {
      const rows = Array.from(document.getElementById(`items-${gi}-${ci}`).querySelectorAll('.item-row'));
      cat.items = rows.map(r => {
        const isHdr = r.classList.contains('header-row');
        const name  = r.querySelector('.item-name-input')?.value || '';
        const price = r.querySelector('.item-price-input')?.value || '';
        return isHdr ? { type: 'header', name } : { name, price };
      });
      const metas = document.querySelectorAll(`#cat-${gi}-${ci} .meta-input`);
      if (metas[0]) cat.note       = metas[0].value || null;
      if (metas[1]) cat.footerNote = metas[1].value || null;
    });
  });
}

async function saveMenu() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  setStatus('Guardando...', '');
  collectAll();

  try {
    const res = await fetch('/api/menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: sessionPwd, menu: menuData }),
    });
    const data = await res.json();

    if (!res.ok) {
      if (res.status === 401) {
        setStatus('Contraseña incorrecta. Cierra sesión y vuelve a entrar.', 'err');
        sessionStorage.removeItem('adm_ok');
      } else {
        setStatus('Error: ' + (data.error || 'desconocido'), 'err');
      }
    } else {
      isDirty = false;
      setStatus('✓ ' + data.message, 'ok');
    }
  } catch (e) {
    setStatus('Error de red: ' + e.message, 'err');
  }

  btn.disabled = false;
}

// ─── Util ─────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
